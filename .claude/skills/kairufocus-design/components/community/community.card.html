<!-- @dsCard group="Components" viewport="700x820" name="Community" subtitle="ProfileHero · SprintStatus · AvatarStack · OpenSprintRow" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .pane { padding: 20px; background: var(--surface-base); color: var(--text-primary); display: flex; flex-direction: column; gap: 14px; }
  .cap { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  // Fictitious data only: no real member, no real avatar.
  const DS = window.KairuFocusDesignSystem_0d3740;
  const { ProfileHero, SprintStatus, AvatarStack, OpenSprintRow } = DS;

  function Pane({ theme, children }) {
    return <div className="pane" data-bs-theme={theme}>{children}</div>;
  }

  function App() {
    if (!ProfileHero) {
      return <p className="cap" style={{ padding: 20 }}>Composants « community » absents du bundle : lancer /design-sync pour le recompiler.</p>;
    }
    const others = [{ name: "tomtom" }, { name: "ada_l" }, { name: "linus" }];
    return (
      <>
        <Pane theme="light">
          <span className="cap">Clair — bandeau avec sprint ouvert</span>
          <ProfileHero name="lea_dev" githubLogin="lea_dev" since="Dans la communauté depuis octobre 2026">
            <SprintStatus state="open" timeLeft="18:24"
              avatars={<AvatarStack members={others} max={2} />}
              withText="avec tomtom et 2 autres" onJoin={() => {}} />
          </ProfileHero>
          <span className="cap">Lignes « En sprint maintenant »</span>
          <div className="card">
            <OpenSprintRow name="lea_dev" timeLeft="18:24" participantsText="3 participants" onJoin={() => {}} />
            <OpenSprintRow name="tomtom" timeLeft="09:02" participantsText="1 participant" mine />
          </div>
        </Pane>
        <Pane theme="dark">
          <span className="cap">Sombre — bandeau sans sprint ouvert (nom choisi : initiale, pas de lien GitHub)</span>
          <ProfileHero name="tomtom" since="Dans la communauté depuis septembre 2026">
            <SprintStatus state="closed" togetherText="38 sprints faits ensemble" />
          </ProfileHero>
          <span className="cap">Lignes « En sprint maintenant »</span>
          <div className="card">
            <OpenSprintRow name="lea_dev" timeLeft="18:24" participantsText="3 participants" onJoin={() => {}} />
            <OpenSprintRow name="tomtom" timeLeft="09:02" participantsText="1 participant" mine />
          </div>
          <span className="cap">AvatarStack — 1, 3 et 5 membres</span>
          <div className="row">
            <AvatarStack members={others.slice(0, 1)} />
            <AvatarStack members={others} />
            <AvatarStack members={[...others, { name: "grace" }, { name: "ken" }]} max={3} />
          </div>
        </Pane>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
