<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KairuFocus — Your developer workspace</title>

    <!-- Search and share metadata: static on purpose, crawlers that do not run JS only see this file. -->
    <meta name="description" content="Tasks, Pomodoro sprints and a daily journal for developers, in one focused workspace. Focus as a group and let your AI manage your tasks via MCP." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kairufocus.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KairuFocus" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://kairufocus.com/" />
    <meta property="og:title" content="KairuFocus — Your developer workspace" />
    <meta property="og:description" content="Tasks, Pomodoro sprints and a daily journal for developers, in one focused workspace. Focus as a group and let your AI manage your tasks via MCP." />
    <meta property="og:image" content="https://kairufocus.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KairuFocus — The workspace to stay focused. Tasks, Pomodoro sprints, daily journal, focus as a group, MCP." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KairuFocus — Your developer workspace" />
    <meta name="twitter:description" content="Tasks, Pomodoro sprints and a daily journal for developers, in one focused workspace. Focus as a group and let your AI manage your tasks via MCP." />
    <meta name="twitter:image" content="https://kairufocus.com/og-image.png" />
    <meta name="twitter:image:alt" content="KairuFocus — The workspace to stay focused. Tasks, Pomodoro sprints, daily journal, focus as a group, MCP." />

    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link href="KairuFocus.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/sw-registration.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/community.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
      window.blazorCulture = {
        get: () => window.localStorage['BlazorCulture'],
        set: (value) => window.localStorage['BlazorCulture'] = value
      };
    </script>
</body>

</html>
